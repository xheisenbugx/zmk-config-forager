layout: {zmk_keyboard: forager}
layers:
  BASE:
  - Q
  - W
  - E
  - R
  - T
  - Y
  - U
  - I
  - O
  - P
  - {t: A, h: LSHIFT}
  - {t: S, h: LCTRL}
  - {t: D, h: LALT}
  - {t: F, h: LGUI}
  - {t: G, h: Meh+LGUI}
  - {t: H, h: Meh+LGUI}
  - {t: J, h: RIGHT GUI}
  - {t: K, h: RALT}
  - {t: L, h: RCTRL}
  - {t: '''', h: RSHIFT}
  - Z
  - X
  - C
  - V
  - B
  - N
  - M
  - ','
  - .
  - /
  - {t: BACKSPACE, h: numbers}
  - {t: TAB, h: navigation}
  - {t: RET, h: navigation}
  - {t: SPACE, h: numbers}
  numbers:
  - '!'
  - '@'
  - '{'
  - '}'
  - '|'
  - KP PLUS
  - '7'
  - '8'
  - '9'
  - '*'
  - {t: '#', h: LSHIFT}
  - {t: $, h: LCTRL}
  - {t: (, h: LALT}
  - {t: ), h: LGUI}
  - '&'
  - KP EQUAL
  - {t: '4', h: RGUI}
  - {t: '5', h: RALT}
  - {t: '6', h: RCTRL}
  - {t: ;, h: RSHIFT}
  - '%'
  - ^
  - '['
  - ']'
  - '~'
  - '-'
  - '1'
  - '2'
  - '3'
  - /
  - {t: \, type: held}
  - '`'
  - SPACE
  - '0'
  navigation:
  - ''
  - VOLUME DOWN
  - MUTE
  - VOLUME UP
  - Meh+C
  - Meh+LEFT
  - Meh+DOWN
  - Meh+UP
  - Meh+RIGHT
  - Meh+RET
  - {t: ESCAPE, h: LSHIFT}
  - {t: PREV, h: LCTRL}
  - {t: PP, h: LALT}
  - {t: NEXT, h: LGUI}
  - Meh+BSPC
  - LEFT ARROW
  - DOWN
  - UP ARROW
  - RIGHT
  - Ctl+Gui+F
  - ''
  - CUT
  - COPY
  - PASTE
  - ''
  - HOME
  - PAGE DOWN
  - PAGE UP
  - END
  - Meh+N
  - {t: ▽, type: trans}
  - {type: held}
  - {t: ▽, type: trans}
  - {t: ▽, type: trans}
combos:
- p: [16, 17]
  k: ESC
  l: [BASE]
- p: [13, 16]
  k: '&caps_word'
  l: [BASE]
- p: [21, 22]
  k: Gui+C
  l: [BASE]
- p: [22, 23]
  k: Gui+V
  l: [BASE]
- p: [21, 23]
  k: Gui+X
  l: [BASE]
- p: [15, 25]
  k: _
  l: [BASE]
