layout: {zmk_keyboard: forager}
layers:
  BASE:
  - Q
  - W
  - E
  - R
  - T
  - Y
  - U
  - I
  - O
  - P
  - {t: A, h: LCTRL}
  - {t: S, h: LALT}
  - {t: D, h: Gui+LCTRL}
  - {t: F, h: LSHFT}
  - G
  - H
  - {t: J, h: RSHFT}
  - {t: K, h: RGUI}
  - {t: L, h: RALT}
  - {t: ;, h: RCTRL}
  - Z
  - X
  - C
  - V
  - B
  - N
  - M
  - {t: ',', s: ;}
  - {t: ., s: ':'}
  - /
  - {t: BACKSPACE, h: numbers}
  - {t: TAB, h: navigation}
  - {t: RET, h: navigation}
  - {t: SPACE, h: numbers}
  numbers:
  - '!'
  - '@'
  - '{'
  - '}'
  - '|'
  - KP PLUS
  - '7'
  - '8'
  - '9'
  - '*'
  - '#'
  - $
  - (
  - )
  - '&'
  - KP EQUAL
  - '4'
  - '5'
  - '6'
  - ''''
  - '%'
  - ^
  - '['
  - ']'
  - '~'
  - KP MINUS
  - '1'
  - '2'
  - '3'
  - /
  - {t: \, type: held}
  - '`'
  - SPACE
  - '0'
  navigation:
  - ''
  - VOLUME DOWN
  - MUTE
  - VOLUME UP
  - ''
  - ''
  - ''
  - ''
  - ''
  - ''
  - ''
  - PREV
  - PLAY PAUSE
  - NEXT
  - ''
  - LEFT ARROW
  - DOWN
  - UP ARROW
  - RIGHT
  - ''
  - ''
  - CUT
  - COPY
  - PASTE
  - ''
  - HOME
  - PAGE DOWN
  - PAGE UP
  - END
  - ''
  - {t: ▽, type: trans}
  - {type: held}
  - {t: ▽, type: trans}
  - {t: ▽, type: trans}
combos:
- p: [0, 1]
  k: ESC
  l: [BASE]
- p: [13, 16]
  k: '&caps_word'
  l: [BASE]
- p: [7, 8]
  k: BSPC
  l: [BASE]
- p: [8, 9]
  k: DEL
  l: [BASE]
- p: [11, 12]
  k: TAB
  l: [BASE]
- p: [17, 18]
  k: RET
  l: [BASE]
- p: [16, 17]
  k: '&num_word 2'
  l: [BASE]
- p: [21, 22]
  k: Gui+C
  l: [BASE]
- p: [22, 23]
  k: Gui+V
  l: [BASE]
- p: [21, 23]
  k: Gui+X
  l: [BASE]
- p: [16, 26]
  k: '-'
  l: [BASE]
- p: [15, 25]
  k: _
  l: [BASE]
- p: [13, 23]
  k: '='
  l: [BASE]
- p: [11, 21]
  k: '`'
  l: [BASE]
